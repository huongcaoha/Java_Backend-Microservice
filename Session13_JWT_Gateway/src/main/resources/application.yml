
spring:
  application:
    name: Session13_JWT_Gateway
  cloud:
    gateway:
      routes:
        - id: user_service_route
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**
        - id: product_service_route
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/products/**

    config:
      uri: http://localhost:8888
      name: api-gateway

application:
  jwt:
    secret: YOUR_JWT_SECRET_KEY_BASE64_ENCODED
    expiration: 3600000